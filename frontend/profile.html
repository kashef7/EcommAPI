<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#194350" />
    <title>Profile | Royal Market</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      (function () {
        var theme = 'light';
        try {
          var stored = window.localStorage.getItem('rm.theme');
          if (stored === 'light' || stored === 'dark') {
            theme = stored;
          } else if (
            window.matchMedia &&
            window.matchMedia('(prefers-color-scheme: dark)').matches
          ) {
            theme = 'dark';
          }
        } catch (error) {
          try {
            if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
              theme = 'dark';
            }
          } catch (mediaError) {
            theme = 'light';
          }
        }
        document.documentElement.dataset.theme = theme;
        var themeMeta = document.querySelector('meta[name="theme-color"]');
        if (themeMeta) {
          themeMeta.setAttribute('content', '#194350');
        }
      })();
    </script>
    <style>
      html,
      body {
        background-color: #f5f8f7;
      }
      html[data-theme='dark'],
      html[data-theme='dark'] body {
        background-color: #0b1014;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/pages/profile/main.tsx"></script>
  </body>
</html>
